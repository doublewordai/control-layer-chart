name: Publish Chart

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Chart version to publish (e.g., 0.1.0)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.13.0"

      - name: Install yq
        uses: mikefarah/yq@master

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # Extract version from Chart.yaml (already updated by Release Please)
            VERSION=$(yq '.version' Chart.yaml)
          fi
          # Remove 'v' prefix if present
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - name: Lint chart
        run: helm lint .

      - name: Package chart
        run: |
          helm package . --version ${{ steps.version.outputs.version }}
          echo "Packaged chart: control-layer-${{ steps.version.outputs.version }}.tgz"

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Push chart to OCI registry
        run: |
          helm push control-layer-${{ steps.version.outputs.version }}.tgz oci://ghcr.io/doublewordai/charts
          echo "✅ Chart published to ghcr.io/doublewordai/charts/control-layer:${{ steps.version.outputs.version }}"

      - name: Summary
        run: |
          echo "## 🎉 Chart Published Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Chart:** control-layer" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** ghcr.io/doublewordai/charts/control-layer" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "helm install my-control-layer oci://ghcr.io/doublewordai/charts/control-layer --version ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
