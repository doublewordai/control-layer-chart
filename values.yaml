# Default values for control-layer subchart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This is for the secrets for pulling an image from a private repository
imagePullSecrets: []

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# Service-specific secrets configuration
secrets:
  controlLayer:
    # Whether to create this secret. If its not created, it ought to exist as name with these values
    data:
      # DATABASE_URL will be templated in secret.yaml for internal PostgreSQL (if empty)
      # For external PostgreSQL, override with your external connection string
      DATABASE_URL: ""
      # If you're using stripe for payment, you'll also want:
      #DWCTL_PAYMENT__STRIPE__API_KEY:
      #DWCTL_PAYMENT__STRIPE__WEBHOOK_SECRET:
      #DWCTL_PAYMENT__STRIPE__PRICE_ID:

  # PostgreSQL database credentials (used if postgresql.enabled is true)
  postgres:
    data:
      POSTGRES_DB: "clay"
      POSTGRES_USER: "clay"
      POSTGRES_PASSWORD: "clay_password"

# This will set the replicaset count
replicaCount: 1

# This sets the container image
image:
  repository: ghcr.io/doublewordai/control-layer
  pullPolicy: IfNotPresent
  tag: ""

# This is for setting Kubernetes Annotations to a Pod.
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service
service:
  type: ClusterIP
  port: 3001

# ServiceMonitor configuration for Prometheus monitoring
serviceMonitor:
  enabled: false
  path: /metrics
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

# Environment variables
env: {}

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Liveness and readiness probes
livenessProbe:
  httpGet:
    path: /healthz
    port: http
readinessProbe:
  httpGet:
    path: /healthz
    port: http

# Startup probe - allows extra time for migrations and advisory lock acquisition
# startupProbe:
#   httpGet:
#     path: /healthz
#     port: http
#   initialDelaySeconds: 5
#   periodSeconds: 5
#   timeoutSeconds: 5
#   failureThreshold: 18  # 90 seconds max startup

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# Control Layer configuration file content
config: |
  # Control Layer Configuration
  # Server configuration
  host: "0.0.0.0"
  port: 3001

  # Frontend metadata
  metadata:
    region: "Europe"
    organization: "Doubleword"

  # Authentication configuration
  auth:
    # Native authentication (email/password)
    native:
      enabled: false

    # Proxy header authentication (for use with oa2p-proxy)
    proxy_header:
      enabled: true
      header_name: "x-doubleword-user"
      groups_field_name: "x-doubleword-user-groups"
      provider_field_name: "x-doubleword-sso-provider"
      auto_create_users: true
      import_idp_groups: true

    # Security settings
    security:
      cors:
        allowed_origins:
          - "https://localhost"

  # Secret key for session signing (set via DWCTL_SECRET_KEY environment variable)
  secret_key: "your-secret-key-here"

# Fusillade Daemon Configuration
# When enabled, deploys the fusillade daemon as a separate deployment from the control layer.
# This sets background_services.batch_daemon.enabled to:
#   - "never" on control-layer pods (disables fusillade there)
#   - "always" on fusillade pods (runs fusillade daemon)
fusillade:
  # Set to true to deploy fusillade daemon separately from the control layer
  enabled: false

  # Number of fusillade daemon replicas
  replicaCount: 1

  # Override image settings for fusillade (defaults to main image settings)
  image: {}
    # repository: ghcr.io/doublewordai/control-layer
    # pullPolicy: IfNotPresent
    # tag: ""

  # Resource limits and requests for fusillade pods
  resources: {}
    # limits:
    #   cpu: 500m
    #   memory: 512Mi
    # requests:
    #   cpu: 100m
    #   memory: 256Mi

  # Pod annotations specific to fusillade
  podAnnotations: {}

  # Pod labels specific to fusillade
  podLabels: {}

  # Security contexts for fusillade pods
  podSecurityContext: {}
  securityContext: {}

  # Node selection and scheduling
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Liveness probe for fusillade daemon
  # Defaults to HTTP healthcheck on the same port as the control layer
  livenessProbe:
    httpGet:
      path: /healthz
      port: http

  # Readiness probe for fusillade daemon
  readinessProbe:
    httpGet:
      path: /healthz
      port: http

  # Startup probe for fusillade daemon
  # Allows extra time for migrations and advisory lock acquisition during startup
  # startupProbe:
  #   httpGet:
  #     path: /healthz
  #     port: http
  #   initialDelaySeconds: 5
  #   periodSeconds: 5
  #   timeoutSeconds: 5
  #   failureThreshold: 18  # 90 seconds max startup

  # Database pool overrides for fusillade
  # These override the main config's database pool settings for fusillade pods only
  # Useful when fusillade needs different connection limits than control-layer pods
  database:
    # Main database pool settings (overrides config.database.pool)
    pool: {}
      # max_connections: 100
      # min_connections: 1
      # acquire_timeout_secs: 30
      # idle_timeout_secs: 600
      # max_lifetime_secs: 1800
    # Replica pool settings (overrides config.database.replica_pool)
    replica_pool: {}
      # max_connections: 100
      # min_connections: 1
    # Fusillade schema pool settings (overrides config.database.fusillade.pool)
    fusillade_pool: {}
      # max_connections: 100
      # min_connections: 1
    # Fusillade schema replica pool settings (overrides config.database.fusillade.replica_pool)
    fusillade_replica_pool: {}
      # max_connections: 100
      # min_connections: 1
    # Outlet schema pool settings (overrides config.database.outlet.pool)
    outlet_pool: {}
      # max_connections: 100
      # min_connections: 1
    # Outlet schema replica pool settings (overrides config.database.outlet.replica_pool)
    outlet_replica_pool: {}
      # max_connections: 100
      # min_connections: 1

  # Additional environment variables for fusillade (merged with main env)
  env: {}

  # Additional volumes for fusillade pods
  volumes: []

  # Additional volume mounts for fusillade pods
  volumeMounts: []

# Bootstrap JavaScript configuration
bootstrap:
  enabled: false
  # You can either provide a file path (relative to chart root) or direct content
  # file: ""
  # Inline bootstrap JS content should be base64 encoded
  # content: |
  #   ...

# Scouter Configuration
# When enabled, deploys the scouter collector as a separate deployment from the control layer.
# Scouter needs network access to the control-layer admin/monitoring endpoints.
scouter:
  enabled: true

  replicaCount: 1

  image:
    repository: ghcr.io/doublewordai/scouter
    pullPolicy: IfNotPresent
    tag: "latest"

  # API keys used by scouter.
  # Scouter always uses SYSTEM_API_KEY from the shared control-layer secret:
  #   secrets.controlLayer.data.SYSTEM_API_KEY

  service:
    type: LoadBalancer
    port: 4321

  env: {}

  resources: {}

  podAnnotations: {}
  podLabels: {}

  podSecurityContext: {}
  securityContext: {}

  nodeSelector: {}
  tolerations: []
  affinity: {}

  livenessProbe:
    httpGet:
      path: /report
      port: http

  readinessProbe:
    httpGet:
      path: /report
      port: http

# PostgreSQL Database Configuration
# Set enabled: true to deploy PostgreSQL as part of this chart
# Set enabled: false to use external PostgreSQL (configure DATABASE_URL via secrets.controlLayer.data)
postgresql:
  # Deploy internal PostgreSQL StatefulSet
  enabled: true

  # StatefulSet configuration (only used when enabled: true)
  replicaCount: 1

  image:
    repository: postgres
    pullPolicy: IfNotPresent
    tag: "15"

  # Database credentials are read from secrets.postgres

  # Data persistence settings (only used when enabled: true)
  persistence:
    # Set to false for ephemeral storage (data lost on pod restart)
    enabled: true
    # Leave empty to use cluster default storage class
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 8Gi
    annotations: {}

  # Pod Security Configuration
  # These settings ensure PostgreSQL runs as the postgres user (UID/GID 999)
  # and that mounted volumes have correct ownership
  podSecurityContext:
    # Sets group ownership of mounted volumes to postgres group
    fsGroup: 999
  securityContext:
    # Run container as postgres user (standard for postgres Docker image)
    runAsUser: 999
    runAsGroup: 999
    # Security best practice - prevent running as root
    runAsNonRoot: true
