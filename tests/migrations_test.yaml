suite: test schema migration job
templates:
  - migrations/job.yaml
  - migrations/config.yaml
  - migrations/secret.yaml
  - deployment.yaml
  - fusillade/deployment.yaml
  - configmap.yaml
  - secret.yaml
tests:
  - it: renders nothing when the job is disabled
    templates:
      - migrations/job.yaml
      - migrations/config.yaml
      - migrations/secret.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: leaves application pods on in-process migrations when the job is disabled
    template: deployment.yaml
    set:
      env.RUST_LOG: info
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_MIGRATIONS__MODE
          any: true

  - it: runs dwctl migrate with the exact application image as a PreSync and pre-upgrade hook
    template: migrations/job.yaml
    set:
      migrations.job.enabled: true
      image.tag: "11.11.0@sha256:0123456789abcdef"
    asserts:
      - isKind:
          of: Job
      - matchRegex:
          path: metadata.name
          pattern: ^RELEASE-NAME-control-layer-migrate-[0-9a-f]{8}$
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/doublewordai/control-layer:11.11.0@sha256:0123456789abcdef
      - equal:
          path: spec.template.spec.containers[0].args
          value: ["migrate"]
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: PreSync
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook-delete-policy"]
          value: BeforeHookCreation
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-5"
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation
      - equal:
          path: spec.template.spec.restartPolicy
          value: Never
      - equal:
          path: spec.backoffLimit
          value: 2
      - equal:
          path: spec.activeDeadlineSeconds
          value: 3600
      - isNull:
          path: spec.ttlSecondsAfterFinished
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: migrations
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 1Gi

  - it: names every release's job after its image so a new release never reuses a stale job
    template: migrations/job.yaml
    set:
      migrations.job.enabled: true
      image.tag: "11.12.0@sha256:fedcba9876543210"
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^RELEASE-NAME-control-layer-migrate-[0-9a-f]{8}$
      - notEqual:
          path: metadata.name
          value: RELEASE-NAME-control-layer-migrate-4c18b0e4

  - it: mounts a hook-phase copy of the config rather than the sync-phase configmap
    set:
      migrations.job.enabled: true
      image.tag: "11.11.0"
    asserts:
      - template: migrations/job.yaml
        equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: RELEASE-NAME-control-layer-migrate-config-1b46119e
      - template: migrations/job.yaml
        contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: config
            mountPath: /app/config.yaml
            subPath: control-layer-config.yaml
            readOnly: true
      - template: migrations/config.yaml
        isKind:
          of: ConfigMap
      - template: migrations/config.yaml
        equal:
          path: metadata.name
          value: RELEASE-NAME-control-layer-migrate-config-1b46119e
      - template: migrations/config.yaml
        equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: PreSync
      - template: migrations/config.yaml
        equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-10"
      - template: migrations/config.yaml
        equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-5"
      - template: migrations/config.yaml
        matchRegex:
          path: data["control-layer-config.yaml"]
          pattern: "port: 3001"

  - it: reads an existing runtime secret when the chart renders no credentials
    set:
      migrations.job.enabled: true
      secrets.controlLayer.existingSecret: preview-runtime
      secrets.controlLayer.extraExistingSecrets:
        - staging-runtime
    asserts:
      - template: migrations/job.yaml
        equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - secretRef:
                name: preview-runtime
            - secretRef:
                name: staging-runtime
      - template: migrations/secret.yaml
        hasDocuments:
          count: 0

  - it: copies the chart credentials into a hook-phase secret so PreSync never reads a stale one
    set:
      migrations.job.enabled: true
      image.tag: "11.11.0"
      secrets.controlLayer.data.DATABASE_URL: "postgres://app:pw@db/clay"
      secrets.controlLayer.data.SYSTEM_API_KEY: "sk-system"
      secrets.controlLayer.data.UNSET: ""
    asserts:
      - template: migrations/secret.yaml
        equal:
          path: data.DATABASE_URL
          value: cG9zdGdyZXM6Ly9hcHA6cHdAZGIvY2xheQ==
      - template: migrations/secret.yaml
        equal:
          path: data.SYSTEM_API_KEY
          value: c2stc3lzdGVt
      - template: migrations/secret.yaml
        isNull:
          path: data.UNSET
      - template: migrations/job.yaml
        equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - secretRef:
                name: RELEASE-NAME-control-layer-migrate-secret-1b46119e

  - it: renders rotated credentials into a hook-phase secret the job reads first
    set:
      migrations.job.enabled: true
      image.tag: "11.11.0"
      migrations.job.secretData.DATABASE_URL: "postgres://rotated:pw@ep-new.neon.tech/clay"
      migrations.job.secretData.EMPTY: ""
      secrets.controlLayer.extraExistingSecrets:
        - staging-runtime
      migrations.job.extraExistingSecrets:
        - migrate-extra
    asserts:
      - template: migrations/secret.yaml
        isKind:
          of: Secret
      - template: migrations/secret.yaml
        equal:
          path: metadata.name
          value: RELEASE-NAME-control-layer-migrate-secret-1b46119e
      - template: migrations/secret.yaml
        equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: PreSync
      - template: migrations/secret.yaml
        equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-10"
      - template: migrations/secret.yaml
        equal:
          path: data.DATABASE_URL
          value: cG9zdGdyZXM6Ly9yb3RhdGVkOnB3QGVwLW5ldy5uZW9uLnRlY2gvY2xheQ==
      - template: migrations/secret.yaml
        isNull:
          path: data.EMPTY
      # The hook Secret is last so its rotated DATABASE_URL wins over the
      # not-yet-updated staging-runtime Secret.
      - template: migrations/job.yaml
        equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - secretRef:
                name: staging-runtime
            - secretRef:
                name: migrate-extra
            - secretRef:
                name: RELEASE-NAME-control-layer-migrate-secret-1b46119e

  - it: gives the job the generated in-chart postgres url when none is configured
    template: migrations/secret.yaml
    set:
      migrations.job.enabled: true
      postgresql.enabled: true
    asserts:
      - equal:
          path: data.DATABASE_URL
          value: cG9zdGdyZXM6Ly9jbGF5OmNsYXlfcGFzc3dvcmRAUkVMRUFTRS1OQU1FLWNvbnRyb2wtbGF5ZXItcG9zdGdyZXM6NTQzMi9jbGF5

  - it: switches application and fusillade pods to compatibility checks
    set:
      migrations.job.enabled: true
      fusillade.enabled: true
    asserts:
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_MIGRATIONS__MODE
            value: check
      - template: fusillade/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_MIGRATIONS__MODE
            value: check

  - it: allows keeping in-process migrations during the first transition
    template: deployment.yaml
    set:
      migrations.job.enabled: true
      migrations.startupMode: run
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_MIGRATIONS__MODE
            value: run

  - it: can drop either hook system and merges job env over shared env
    template: migrations/job.yaml
    set:
      migrations.job.enabled: true
      migrations.job.argocd.enabled: false
      migrations.job.ttlSecondsAfterFinished: 600
      env.RUST_LOG: info
      migrations.job.env.RUST_LOG: debug
    asserts:
      - isNull:
          path: metadata.annotations["argocd.argoproj.io/hook"]
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 600
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RUST_LOG
            value: debug
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: RUST_LOG
            value: info

  - it: keeps the job pod out of the application selectors
    set:
      migrations.job.enabled: true
    asserts:
      - template: migrations/job.yaml
        equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: migrations
      - template: deployment.yaml
        equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: control-layer
