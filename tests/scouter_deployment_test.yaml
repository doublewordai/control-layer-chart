suite: test scouter deployment
templates:
  - scouter/deployment.yaml
tests:
  - it: should not create scouter deployment when disabled
    set:
      scouter.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should create scouter deployment when enabled
    set:
      scouter.enabled: true
    asserts:
      - isKind:
          of: Deployment
      - matchRegex:
          path: metadata.name
          pattern: -scouter$
      - equal:
          path: spec.template.spec.containers[0].name
          value: scouter
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CONTROL_LAYER_BASE_URL
            value: "http://RELEASE-NAME-control-layer:3001"

  - it: should set api keys from shared secret
    set:
      scouter.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: RELEASE-NAME-control-layer-secret
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CONTROL_LAYER_API_KEY
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-control-layer-secret
                key: SYSTEM_API_KEY
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SCOUTER_INGEST_API_KEY
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-control-layer-secret
                key: SYSTEM_API_KEY

