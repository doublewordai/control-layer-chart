suite: test scouter deployment
templates:
  - scouter/deployment.yaml
tests:
  - it: should not create scouter deployment when disabled
    set:
      scouter.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should create scouter deployment when enabled
    set:
      scouter.enabled: true
    asserts:
      - isKind:
          of: Deployment
      - matchRegex:
          path: metadata.name
          pattern: -scouter$
      - equal:
          path: spec.template.spec.containers[0].name
          value: scouter
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CONTROL_LAYER_BASE_URL
            value: "http://RELEASE-NAME-control-layer:3001"

  - it: should default control-layer api key to SYSTEM_API_KEY from envFrom
    set:
      scouter.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: RELEASE-NAME-control-layer-secret
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CONTROL_LAYER_API_KEY
            value: "$(SYSTEM_API_KEY)"

  - it: should default ingest api key to SYSTEM_API_KEY from envFrom
    set:
      scouter.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SCOUTER_INGEST_API_KEY
            value: "$(SYSTEM_API_KEY)"

  - it: should allow overriding control layer base url
    set:
      scouter.enabled: true
      scouter.controlLayerBaseUrl: "http://custom:1234"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CONTROL_LAYER_BASE_URL
            value: "http://custom:1234"
