suite: test control-layer deployment
templates:
  - deployment.yaml
  - configmap.yaml
  - secret.yaml
tests:
  - it: should create control-layer deployment with default appVersion
    template: deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - matchRegex:
          path: metadata.name
          pattern: -control-layer$
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ^ghcr\.io/doublewordai/control-layer:.*$
      - equal:
          path: spec.template.spec.containers[0].name
          value: control-layer
      - equal:
          path: spec.replicas
          value: 1

  - it: should use custom image tag when specified
    template: deployment.yaml
    set:
      image.tag: "custom-tag"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/doublewordai/control-layer:custom-tag

  - it: should mount config and use secrets when enabled
    template: deployment.yaml
    set:
      secrets.controlLayer.data.DATABASE_URL: "postgres://test"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: config
            mountPath: /app/config.yaml
            subPath: control-layer-config.yaml
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: config
            configMap:
              name: RELEASE-NAME-control-layer-config
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: RELEASE-NAME-control-layer-secret

  - it: should consume an existing runtime secret
    template: deployment.yaml
    set:
      secrets.controlLayer.existingSecret: externally-managed-runtime
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: externally-managed-runtime

  - it: should load overlay secrets after the primary secret
    template: deployment.yaml
    set:
      secrets.controlLayer.extraExistingSecrets:
        - rotated-database
        - ephemeral-token
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: RELEASE-NAME-control-layer-secret
      - equal:
          path: spec.template.spec.containers[0].envFrom[1].secretRef.name
          value: rotated-database
      - equal:
          path: spec.template.spec.containers[0].envFrom[2].secretRef.name
          value: ephemeral-token

  - it: should use correct labels and selectors
    template: deployment.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: control-layer
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: control-layer
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: control-layer

  - it: should preserve the existing rollout behavior by default
    template: deployment.yaml
    asserts:
      - notExists:
          path: spec.strategy
      - notExists:
          path: spec.minReadySeconds
      - notExists:
          path: spec.progressDeadlineSeconds
      - notExists:
          path: spec.template.spec.terminationGracePeriodSeconds
      - notExists:
          path: spec.template.spec.containers[0].lifecycle

  - it: should render the aligned graceful rollout contract when enabled
    template: deployment.yaml
    set:
      rollout.enabled: true
      rollout.strategy.type: RollingUpdate
      rollout.strategy.rollingUpdate.maxUnavailable: 0
      rollout.strategy.rollingUpdate.maxSurge: 1
      rollout.endpointDrainDelaySeconds: 15
      rollout.connectionDrainTimeoutSeconds: 3600
      rollout.terminationGracePeriodSeconds: 3700
      rollout.minReadySeconds: 15
      rollout.progressDeadlineSeconds: 4200
    asserts:
      - equal:
          path: spec.strategy
          value:
            type: RollingUpdate
            rollingUpdate:
              maxUnavailable: 0
              maxSurge: 1
      - equal:
          path: spec.minReadySeconds
          value: 15
      - equal:
          path: spec.progressDeadlineSeconds
          value: 4200
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 3700
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.exec.command
          value:
            - /bin/sh
            - -c
            - sleep 15

  - it: should reject a grace period that cannot outlast endpoint draining
    template: deployment.yaml
    set:
      rollout.enabled: true
      rollout.endpointDrainDelaySeconds: 15
      rollout.connectionDrainTimeoutSeconds: 3600
      rollout.terminationGracePeriodSeconds: 15
      rollout.progressDeadlineSeconds: 4200
    asserts:
      - failedTemplate:
          errorMessage: rollout.terminationGracePeriodSeconds must be greater than rollout.endpointDrainDelaySeconds

  - it: should reject a progress deadline that cannot outlast graceful termination
    template: deployment.yaml
    set:
      rollout.enabled: true
      rollout.endpointDrainDelaySeconds: 15
      rollout.connectionDrainTimeoutSeconds: 3600
      rollout.terminationGracePeriodSeconds: 3700
      rollout.progressDeadlineSeconds: 3700
    asserts:
      - failedTemplate:
          errorMessage: rollout.progressDeadlineSeconds must be greater than rollout.terminationGracePeriodSeconds

  - it: should reject a grace period shorter than the complete request drain
    template: deployment.yaml
    set:
      rollout.enabled: true
      rollout.endpointDrainDelaySeconds: 15
      rollout.connectionDrainTimeoutSeconds: 3600
      rollout.terminationGracePeriodSeconds: 3615
      rollout.progressDeadlineSeconds: 4200
    asserts:
      - failedTemplate:
          errorMessage: rollout.terminationGracePeriodSeconds must exceed rollout.endpointDrainDelaySeconds plus rollout.connectionDrainTimeoutSeconds

  - it: should reject a rolling strategy that can remove serving capacity
    template: deployment.yaml
    set:
      rollout.enabled: true
      rollout.strategy.type: RollingUpdate
      rollout.strategy.rollingUpdate.maxUnavailable: 1
      rollout.strategy.rollingUpdate.maxSurge: 1
      rollout.endpointDrainDelaySeconds: 15
      rollout.connectionDrainTimeoutSeconds: 3600
      rollout.terminationGracePeriodSeconds: 3700
      rollout.progressDeadlineSeconds: 4200
    asserts:
      - failedTemplate:
          errorMessage: rollout.strategy must use RollingUpdate with maxUnavailable 0 and maxSurge 1

  - it: should reject negative rollout timings
    template: deployment.yaml
    set:
      rollout.enabled: true
      rollout.endpointDrainDelaySeconds: -1
      rollout.connectionDrainTimeoutSeconds: 3600
      rollout.terminationGracePeriodSeconds: 3700
      rollout.progressDeadlineSeconds: 4200
    asserts:
      - failedTemplate:
          errorMessage: rollout timing values must be non-negative and connectionDrainTimeoutSeconds must be positive

  - it: should require the control-layer application drain duration
    template: deployment.yaml
    set:
      rollout.enabled: true
      rollout.endpointDrainDelaySeconds: 15
      rollout.connectionDrainTimeoutSeconds: 1
      rollout.terminationGracePeriodSeconds: 3700
      rollout.progressDeadlineSeconds: 4200
    asserts:
      - failedTemplate:
          errorMessage: rollout.connectionDrainTimeoutSeconds must be 3600 to match the control-layer request timeout

  - it: should render replicas by default (no autoscaling)
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: should omit replicas when autoscaling is enabled
    template: deployment.yaml
    set:
      autoscaling.enabled: true
    asserts:
      - isNull:
          path: spec.replicas

  - it: should inject DWCTL_DATABASE__REPLICA_GROUP for the control-layer component
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_DATABASE__REPLICA_GROUP
            value: control-layer

  - it: should not duplicate DWCTL_DATABASE__REPLICA_GROUP when the user sets it
    template: deployment.yaml
    set:
      env:
        DWCTL_DATABASE__REPLICA_GROUP: custom-group
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_DATABASE__REPLICA_GROUP
            value: custom-group
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_DATABASE__REPLICA_GROUP
            value: control-layer
