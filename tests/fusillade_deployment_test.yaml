suite: test fusillade deployment
templates:
  - fusillade/deployment.yaml
  - configmap.yaml
  - secret.yaml
tests:
  - it: should not create fusillade deployment when disabled
    template: fusillade/deployment.yaml
    set:
      fusillade.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should create fusillade deployment when enabled
    template: fusillade/deployment.yaml
    set:
      fusillade.enabled: true
    asserts:
      - isKind:
          of: Deployment
      - matchRegex:
          path: metadata.name
          pattern: -fusillade$
      - equal:
          path: spec.template.spec.containers[0].name
          value: fusillade
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: fusillade

  - it: should consume the control layer existing runtime secret
    template: fusillade/deployment.yaml
    set:
      fusillade.enabled: true
      secrets.controlLayer.existingSecret: externally-managed-runtime
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: externally-managed-runtime

  - it: should always enable batch daemon via env var
    template: fusillade/deployment.yaml
    set:
      fusillade.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_BACKGROUND_SERVICES__BATCH_DAEMON__ENABLED
            value: "always"

  - it: should use the application default daemon mode for the standard fusillade deployment
    template: fusillade/deployment.yaml
    set:
      fusillade.enabled: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_BACKGROUND_SERVICES__BATCH_DAEMON__MODE
          any: true

  - it: should allow overriding daemon mode for the standard fusillade deployment
    template: fusillade/deployment.yaml
    set:
      fusillade.enabled: true
      fusillade.mode: batch_only
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_BACKGROUND_SERVICES__BATCH_DAEMON__MODE
            value: "batch_only"

  - it: should set database pool env vars when fusillade.database.pool is configured
    template: fusillade/deployment.yaml
    set:
      fusillade.enabled: true
      fusillade.database.pool.max_connections: 100
      fusillade.database.pool.min_connections: 5
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_DATABASE__POOL__MAX_CONNECTIONS
            value: "100"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_DATABASE__POOL__MIN_CONNECTIONS
            value: "5"

  - it: should set replica pool env vars when fusillade.database.replica_pool is configured
    template: fusillade/deployment.yaml
    set:
      fusillade.enabled: true
      fusillade.database.replica_pool.max_connections: 200
      fusillade.database.replica_pool.min_connections: 10
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_DATABASE__REPLICA_POOL__MAX_CONNECTIONS
            value: "200"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_DATABASE__REPLICA_POOL__MIN_CONNECTIONS
            value: "10"

  - it: should set fusillade schema pool env vars when configured
    template: fusillade/deployment.yaml
    set:
      fusillade.enabled: true
      fusillade.database.fusillade_pool.max_connections: 500
      fusillade.database.fusillade_pool.min_connections: 1
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_DATABASE__FUSILLADE__POOL__MAX_CONNECTIONS
            value: "500"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_DATABASE__FUSILLADE__POOL__MIN_CONNECTIONS
            value: "1"

  - it: should set fusillade replica pool env vars when configured
    template: fusillade/deployment.yaml
    set:
      fusillade.enabled: true
      fusillade.database.fusillade_replica_pool.max_connections: 300
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_DATABASE__FUSILLADE__REPLICA_POOL__MAX_CONNECTIONS
            value: "300"

  - it: should set outlet pool env vars when configured
    template: fusillade/deployment.yaml
    set:
      fusillade.enabled: true
      fusillade.database.outlet_pool.max_connections: 150
      fusillade.database.outlet_replica_pool.max_connections: 150
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_DATABASE__OUTLET__POOL__MAX_CONNECTIONS
            value: "150"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_DATABASE__OUTLET__REPLICA_POOL__MAX_CONNECTIONS
            value: "150"

  - it: should set all pool settings together
    template: fusillade/deployment.yaml
    set:
      fusillade.enabled: true
      fusillade.database.pool.max_connections: 100
      fusillade.database.replica_pool.max_connections: 100
      fusillade.database.fusillade_pool.max_connections: 500
      fusillade.database.fusillade_replica_pool.max_connections: 500
      fusillade.database.outlet_pool.max_connections: 200
      fusillade.database.outlet_replica_pool.max_connections: 200
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_DATABASE__POOL__MAX_CONNECTIONS
            value: "100"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_DATABASE__REPLICA_POOL__MAX_CONNECTIONS
            value: "100"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_DATABASE__FUSILLADE__POOL__MAX_CONNECTIONS
            value: "500"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_DATABASE__FUSILLADE__REPLICA_POOL__MAX_CONNECTIONS
            value: "500"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_DATABASE__OUTLET__POOL__MAX_CONNECTIONS
            value: "200"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_DATABASE__OUTLET__REPLICA_POOL__MAX_CONNECTIONS
            value: "200"

  - it: should not set database pool env vars when not configured
    template: fusillade/deployment.yaml
    set:
      fusillade.enabled: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_DATABASE__POOL__MAX_CONNECTIONS
          any: true

  - it: should render separate request and batch daemon deployments when split mode is enabled
    template: fusillade/deployment.yaml
    set:
      fusillade.enabled: true
      fusillade.split.enabled: true
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: RELEASE-NAME-control-layer-fusillade-request
        documentIndex: 0
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: fusillade-request
        documentIndex: 0
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: fusillade-request
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_BACKGROUND_SERVICES__BATCH_DAEMON__MODE
            value: "request_only"
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-control-layer-fusillade-batch
        documentIndex: 1
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: fusillade-batch
        documentIndex: 1
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: fusillade-batch
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_BACKGROUND_SERVICES__BATCH_DAEMON__MODE
            value: "batch_only"
        documentIndex: 1

  - it: should independently configure and scale split daemon deployments
    template: fusillade/deployment.yaml
    set:
      fusillade.enabled: true
      fusillade.replicaCount: 2
      fusillade.resources.requests.cpu: 100m
      fusillade.database.fusillade_pool.min_connections: 2
      fusillade.split.enabled: true
      fusillade.split.request.replicaCount: 4
      fusillade.split.request.resources.requests.cpu: 250m
      fusillade.split.request.env.REQUEST_DAEMON_ONLY: "true"
      fusillade.split.request.database.fusillade_pool.max_connections: 25
      fusillade.split.batch.replicaCount: 1
      fusillade.split.batch.resources.requests.cpu: 900m
      fusillade.split.batch.env.BATCH_DAEMON_ONLY: "true"
      fusillade.split.batch.database.fusillade_pool.max_connections: 80
    asserts:
      - equal:
          path: spec.replicas
          value: 4
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 250m
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REQUEST_DAEMON_ONLY
            value: "true"
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_DATABASE__FUSILLADE__POOL__MIN_CONNECTIONS
            value: "2"
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_DATABASE__FUSILLADE__POOL__MAX_CONNECTIONS
            value: "25"
        documentIndex: 0
      - equal:
          path: spec.replicas
          value: 1
        documentIndex: 1
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 900m
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BATCH_DAEMON_ONLY
            value: "true"
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_DATABASE__FUSILLADE__POOL__MIN_CONNECTIONS
            value: "2"
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_DATABASE__FUSILLADE__POOL__MAX_CONNECTIONS
            value: "80"
        documentIndex: 1

  - it: should inherit common fusillade replica count in split mode
    template: fusillade/deployment.yaml
    set:
      fusillade.enabled: true
      fusillade.replicaCount: 3
      fusillade.split.enabled: true
    asserts:
      - equal:
          path: spec.replicas
          value: 3
        documentIndex: 0
      - equal:
          path: spec.replicas
          value: 3
        documentIndex: 1

  - it: should allow disabling one split daemon deployment
    template: fusillade/deployment.yaml
    set:
      fusillade.enabled: true
      fusillade.split.enabled: true
      fusillade.split.batch.enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-control-layer-fusillade-request
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_BACKGROUND_SERVICES__BATCH_DAEMON__MODE
            value: "request_only"
