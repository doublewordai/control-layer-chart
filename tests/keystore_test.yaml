suite: test keystore (ZDR key custody Redis)
templates:
  - keystore/statefulset.yaml
  - keystore/service.yaml
  - keystore/storageclass.yaml
  - deployment.yaml
  - fusillade/deployment.yaml
  - secret.yaml
  - configmap.yaml
tests:
  - it: should not create the statefulset when keystore is disabled
    template: keystore/statefulset.yaml
    set:
      keystore.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create the service when keystore is disabled
    template: keystore/service.yaml
    set:
      keystore.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create the internal statefulset in external mode
    template: keystore/statefulset.yaml
    set:
      keystore.enabled: true
      keystore.external.enabled: true
      keystore.external.existingSecret: external-keystore
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create the internal service in external mode
    template: keystore/service.yaml
    set:
      keystore.enabled: true
      keystore.external.enabled: true
      keystore.external.existingSecret: external-keystore
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create the managed storage class in external mode
    template: keystore/storageclass.yaml
    set:
      keystore.enabled: true
      keystore.external.enabled: true
      keystore.external.existingSecret: external-keystore
      keystore.persistence.enabled: true
      keystore.persistence.managedStorageClass.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should create the statefulset with default configuration
    template: keystore/statefulset.yaml
    set:
      keystore.enabled: true
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: metadata.name
          value: RELEASE-NAME-control-layer-keystore
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: keystore
      - equal:
          path: spec.serviceName
          value: RELEASE-NAME-control-layer-keystore
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.containers[0].image
          value: "redis:7.4"

  - it: should render pod annotations only when set (never a bare annotations key)
    template: keystore/statefulset.yaml
    set:
      keystore.enabled: true
      keystore.podAnnotations:
        example.com/foo: bar
    asserts:
      - equal:
          path: spec.template.metadata.annotations["example.com/foo"]
          value: bar

  - it: should enable append-only persistence via args
    template: keystore/statefulset.yaml
    set:
      keystore.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - "--appendonly"
            - "yes"
            - "--dir"
            - "/data"

  - it: should mount the data volume and probe with redis-cli ping
    template: keystore/statefulset.yaml
    set:
      keystore.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: keystore-data
            mountPath: /data
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.exec.command
          value: ["redis-cli", "ping"]
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          value: ["redis-cli", "ping"]

  - it: should use custom image configuration when specified
    template: keystore/statefulset.yaml
    set:
      keystore.enabled: true
      keystore.image.repository: "custom-redis"
      keystore.image.tag: "7.2"
      keystore.image.pullPolicy: "Always"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "custom-redis:7.2"
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: "Always"

  - it: should create a persistent volume claim template when persistence enabled
    template: keystore/statefulset.yaml
    set:
      keystore.enabled: true
      keystore.persistence.enabled: true
      keystore.persistence.size: "2Gi"
      keystore.persistence.storageClass: "fast-ssd"
      keystore.persistence.accessModes:
        - ReadWriteOnce
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: keystore-data
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: "2Gi"
      - equal:
          path: spec.volumeClaimTemplates[0].spec.storageClassName
          value: "fast-ssd"
      - contains:
          path: spec.volumeClaimTemplates[0].spec.accessModes
          content: "ReadWriteOnce"

  - it: should carry the backup-exclusion annotation on the volume claim
    template: keystore/statefulset.yaml
    set:
      keystore.enabled: true
      keystore.persistence.enabled: true
      keystore.persistence.annotations:
        backup.velero.io/backup-volumes-excludes: keystore-data
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.annotations["backup.velero.io/backup-volumes-excludes"]
          value: keystore-data

  - it: should use the managed storage class when enabled
    template: keystore/statefulset.yaml
    set:
      keystore.enabled: true
      keystore.persistence.enabled: true
      keystore.persistence.managedStorageClass.enabled: true
      keystore.persistence.managedStorageClass.parameters:
        type: pd-balanced
        disk-encryption-kms-key: projects/example/locations/europe-west2/keyRings/gke-disk-encryption/cryptoKeys/keystore
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.storageClassName
          value: RELEASE-NAME-control-layer-keystore-cmek

  - it: should create a managed storage class for keystore persistence
    template: keystore/storageclass.yaml
    set:
      keystore.enabled: true
      keystore.persistence.enabled: true
      keystore.persistence.managedStorageClass.enabled: true
      keystore.persistence.managedStorageClass.parameters:
        type: pd-balanced
        disk-encryption-kms-key: projects/example/locations/europe-west2/keyRings/gke-disk-encryption/cryptoKeys/keystore
    asserts:
      - isKind:
          of: StorageClass
      - equal:
          path: metadata.name
          value: RELEASE-NAME-control-layer-keystore-cmek
      - equal:
          path: provisioner
          value: pd.csi.storage.gke.io
      - equal:
          path: parameters.type
          value: pd-balanced
      - equal:
          path: parameters["disk-encryption-kms-key"]
          value: projects/example/locations/europe-west2/keyRings/gke-disk-encryption/cryptoKeys/keystore
      - equal:
          path: volumeBindingMode
          value: WaitForFirstConsumer

  - it: should use emptyDir when persistence is disabled
    template: keystore/statefulset.yaml
    set:
      keystore.enabled: true
      keystore.persistence.enabled: false
    asserts:
      - isNull:
          path: spec.volumeClaimTemplates
      - contains:
          path: spec.template.spec.volumes
          content:
            name: keystore-data
            emptyDir: {}

  - it: should create the service on the redis port
    template: keystore/service.yaml
    set:
      keystore.enabled: true
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-control-layer-keystore
      - contains:
          path: spec.ports
          content:
            port: 6379
            targetPort: redis
            protocol: TCP
            name: redis

  - it: should inject the keystore redis_url and current_wrap_key_id env when enabled
    template: deployment.yaml
    set:
      keystore.enabled: true
      keystore.currentWrapKeyId: "k1"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_KEYSTORE__REDIS_URL
            value: "redis://RELEASE-NAME-control-layer-keystore:6379"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_KEYSTORE__CURRENT_WRAP_KEY_ID
            value: "k1"

  - it: should inject the external redis_url from a secret
    template: deployment.yaml
    set:
      keystore.enabled: true
      keystore.external.enabled: true
      keystore.external.existingSecret: external-keystore
      keystore.external.existingSecretKey: connection-url
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_KEYSTORE__REDIS_URL
            valueFrom:
              secretKeyRef:
                name: external-keystore
                key: connection-url
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_KEYSTORE__REDIS_URL
            value: "redis://RELEASE-NAME-control-layer-keystore:6379"

  - it: should require an external redis secret name
    template: deployment.yaml
    set:
      keystore.enabled: true
      keystore.external.enabled: true
      keystore.external.existingSecret: ""
    asserts:
      - failedTemplate:
          errorPattern: "keystore.external.existingSecret is required when external keystore is enabled"

  - it: should require an external redis secret key
    template: deployment.yaml
    set:
      keystore.enabled: true
      keystore.external.enabled: true
      keystore.external.existingSecret: external-keystore
      keystore.external.existingSecretKey: ""
    asserts:
      - failedTemplate:
          errorPattern: "keystore.external.existingSecretKey is required when external keystore is enabled"

  # The fusillade daemon is what encrypts flex bodies at rest, so it needs the
  # same keystore env as the API pods. Regression guard: chart 1.1.0 shipped it
  # on deployment.yaml only, crash-looping the daemon on a missing redis_url.
  - it: should inject the keystore env into the fusillade daemon when enabled
    template: fusillade/deployment.yaml
    set:
      fusillade.enabled: true
      keystore.enabled: true
      keystore.currentWrapKeyId: "k1"
      keystore.defaultTtlSeconds: 86400
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_KEYSTORE__REDIS_URL
            value: "redis://RELEASE-NAME-control-layer-keystore:6379"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_KEYSTORE__CURRENT_WRAP_KEY_ID
            value: "k1"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_KEYSTORE__DEFAULT_TTL_SECONDS
            value: "86400"

  - it: should inject the external redis_url into the fusillade daemon
    template: fusillade/deployment.yaml
    set:
      fusillade.enabled: true
      keystore.enabled: true
      keystore.external.enabled: true
      keystore.external.existingSecret: external-keystore
      keystore.external.existingSecretKey: connection-url
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_KEYSTORE__REDIS_URL
            valueFrom:
              secretKeyRef:
                name: external-keystore
                key: connection-url
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_KEYSTORE__REDIS_URL
            value: "redis://RELEASE-NAME-control-layer-keystore:6379"

  - it: should not inject keystore env into the fusillade daemon when disabled
    template: fusillade/deployment.yaml
    set:
      fusillade.enabled: true
      keystore.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_KEYSTORE__REDIS_URL
            value: "redis://RELEASE-NAME-control-layer-keystore:6379"
