suite: test heap profiling deployment
templates:
  - heap-profile-deployment.yaml
  - heap-profile-networkpolicy.yaml
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - secret.yaml
tests:
  - it: should not render a canary by default
    template: heap-profile-deployment.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should render one diagnostic Deployment when enabled
    set:
      heapProfiling.enabled: true
    template: heap-profile-deployment.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-control-layer-heap-profile
      - equal:
          path: metadata.labels["control-layer.doubleword.ai/diagnostic"]
          value: heap-profile
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.metadata.labels["control-layer.doubleword.ai/diagnostic"]
          value: heap-profile
      - equal:
          path: spec.template.spec.containers[0].name
          value: control-layer

  - it: should carry the API Service selector labels and a distinct diagnostic selector
    set:
      heapProfiling.enabled: true
    template: heap-profile-deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: control-layer
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: control-layer
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: control-layer
      - equal:
          path: spec.selector.matchLabels["control-layer.doubleword.ai/diagnostic"]
          value: heap-profile

  - it: should leave the main Deployment selector unchanged when the canary is enabled
    set:
      heapProfiling.enabled: true
    template: deployment.yaml
    asserts:
      - notExists:
          path: spec.selector.matchLabels["control-layer.doubleword.ai/diagnostic"]
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: control-layer

  - it: should expose http and the pprof port
    set:
      heapProfiling.enabled: true
    template: heap-profile-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: http
            containerPort: 3001
            protocol: TCP
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: pprof
            containerPort: 6060
            protocol: TCP

  - it: should set the heap profiling environment
    set:
      heapProfiling.enabled: true
    template: heap-profile-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: _RJEM_MALLOC_CONF
            value: "prof:true,prof_active:true,lg_prof_sample:19"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_HEAP_PROFILING__ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_HEAP_PROFILING__BIND_ADDRESS
            value: "0.0.0.0:6060"

  - it: should add the Alloy pprof scrape and service name annotations
    set:
      heapProfiling.enabled: true
    template: heap-profile-deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.annotations["profiles.grafana.com/memory.scrape"]
          value: "true"
      - equal:
          path: spec.template.metadata.annotations["profiles.grafana.com/memory.port_name"]
          value: pprof
      - equal:
          path: spec.template.metadata.annotations["profiles.grafana.com/memory.path"]
          value: /debug/pprof/heap
      - equal:
          path: spec.template.metadata.annotations["resource.opentelemetry.io/service.name"]
          value: RELEASE-NAME-control-layer-api

  - it: should omit the scrape annotations when disabled
    set:
      heapProfiling.enabled: true
      heapProfiling.scrapeAnnotations: false
    template: heap-profile-deployment.yaml
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["profiles.grafana.com/memory.scrape"]
      - notExists:
          path: spec.template.metadata.annotations["profiles.grafana.com/memory.port_name"]
      - notExists:
          path: spec.template.metadata.annotations["profiles.grafana.com/memory.path"]
      - notExists:
          path: spec.template.metadata.annotations["resource.opentelemetry.io/service.name"]

  - it: should propagate custom serviceName, lgProfSample and env
    set:
      heapProfiling.enabled: true
      heapProfiling.serviceName: control-layer-heap
      heapProfiling.lgProfSample: 21
      heapProfiling.env.MY_DIAGNOSTIC_VAR: my-value
    template: heap-profile-deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.annotations["resource.opentelemetry.io/service.name"]
          value: control-layer-heap
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: _RJEM_MALLOC_CONF
            value: "prof:true,prof_active:true,lg_prof_sample:21"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MY_DIAGNOSTIC_VAR
            value: my-value

  - it: should merge heapProfiling.env last over the profile defaults
    set:
      heapProfiling.enabled: true
      heapProfiling.env.DWCTL_HEAP_PROFILING__BIND_ADDRESS: "0.0.0.0:7070"
    template: heap-profile-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_HEAP_PROFILING__BIND_ADDRESS
            value: "0.0.0.0:7070"
      - lengthEqual:
          path: spec.template.spec.containers[0].env
          count: 3

  - it: should apply pod labels and annotations to the canary only
    set:
      heapProfiling.enabled: true
      heapProfiling.podLabels.canary: heap
      heapProfiling.podAnnotations.note: canary
    template: heap-profile-deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.labels.canary
          value: heap
      - equal:
          path: spec.template.metadata.annotations.note
          value: canary
      - equal:
          path: spec.template.metadata.annotations["profiles.grafana.com/memory.scrape"]
          value: "true"

  - it: should inherit the API resources by default
    set:
      heapProfiling.enabled: true
      resources.limits.memory: 1Gi
      resources.requests.cpu: 250m
    template: heap-profile-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 1Gi
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 250m

  - it: should allow overriding the canary resources
    set:
      heapProfiling.enabled: true
      resources.limits.memory: 1Gi
      heapProfiling.resources.limits.memory: 2Gi
    template: heap-profile-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 2Gi

  - it: should allow custom replicas and port
    set:
      heapProfiling.enabled: true
      heapProfiling.replicas: 2
      heapProfiling.port: 7070
    template: heap-profile-deployment.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 2
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: pprof
            containerPort: 7070
            protocol: TCP
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DWCTL_HEAP_PROFILING__BIND_ADDRESS
            value: "0.0.0.0:7070"

  - it: should inherit the rollout strategy when enabled
    set:
      heapProfiling.enabled: true
      rollout.enabled: true
    template: heap-profile-deployment.yaml
    asserts:
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
      - equal:
          path: spec.minReadySeconds
          value: 15
      - equal:
          path: spec.progressDeadlineSeconds
          value: 4200

  - it: should never expose the pprof port through the Service
    set:
      heapProfiling.enabled: true
    template: service.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.ports[0].name
          value: http
      - lengthEqual:
          path: spec.ports
          count: 1
      - notContains:
          path: spec.ports
          content:
            name: pprof
            port: 6060
            protocol: TCP

  - it: should not render a NetworkPolicy by default
    set:
      heapProfiling.enabled: true
    template: heap-profile-networkpolicy.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should render a NetworkPolicy that keeps http open and restricts pprof
    set:
      heapProfiling.enabled: true
      heapProfiling.networkPolicy.enabled: true
      heapProfiling.networkPolicy.from[0].namespaceSelector.matchLabels.environment: observability
      heapProfiling.networkPolicy.from[0].podSelector.matchLabels.app: alloy
    template: heap-profile-networkpolicy.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.podSelector.matchLabels["control-layer.doubleword.ai/diagnostic"]
          value: heap-profile
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: control-layer
      - equal:
          path: spec.ingress[0].ports[0].port
          value: http
      - equal:
          path: spec.ingress[1].ports[0].port
          value: pprof
      - equal:
          path: spec.ingress[1].from[0].podSelector.matchLabels.app
          value: alloy

  - it: should deny pprof when the NetworkPolicy has no peers
    set:
      heapProfiling.enabled: true
      heapProfiling.networkPolicy.enabled: true
    template: heap-profile-networkpolicy.yaml
    asserts:
      - hasDocuments:
          count: 1
      - lengthEqual:
          path: spec.ingress
          count: 1
      - equal:
          path: spec.ingress[0].ports[0].port
          value: http
