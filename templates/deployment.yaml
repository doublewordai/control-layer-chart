apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "control-layer.fullname" . }}
  labels:
    {{- include "control-layer.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "control-layer.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: control-layer
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "control-layer.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "control-layer.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: control-layer
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ include "control-layer.fullname" . }}-secret
          env:
            {{- if .Values.bootstrap.enabled }}
            - name: DASHBOARD_BOOTSTRAP_JS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "control-layer.fullname" . }}-bootstrap
                  key: bootstrap.js
            {{- end }}
            {{- if .Values.fusillade.enabled }}
            # Disable fusillade daemon on control-layer pods when running separately
            - name: DWCTL_BACKGROUND_SERVICES__BATCH_DAEMON__ENABLED
              value: "never"
            {{- end }}
            {{- if .Values.keystore.enabled }}
            # ZDR keystore wiring. redis_url always points at the in-cluster
            # keystore Service; current_wrap_key_id comes from values. The wrap
            # key(s) themselves are the only piece the operator supplies as a
            # secret (secrets.controlLayer.data: DWCTL_KEYSTORE__WRAP_KEYS__<ID>).
            # default_ttl_seconds defaults in dwctl (7200s); set
            # keystore.defaultTtlSeconds to override it.
            - name: DWCTL_KEYSTORE__REDIS_URL
              value: "redis://{{ include "control-layer.fullname" . }}-keystore:6379"
            - name: DWCTL_KEYSTORE__CURRENT_WRAP_KEY_ID
              value: {{ .Values.keystore.currentWrapKeyId | quote }}
            {{- with .Values.keystore.defaultTtlSeconds }}
            - name: DWCTL_KEYSTORE__DEFAULT_TTL_SECONDS
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.env }}
            {{- range $key, $value := . }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: control-layer-config.yaml
              readOnly: true
            {{- if .Values.emailTemplates.enabled }}
            - name: email-templates
              mountPath: {{ .Values.emailTemplates.mountPath }}
              readOnly: true
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "control-layer.fullname" . }}-config
        {{- if .Values.emailTemplates.enabled }}
        - name: email-templates
          configMap:
            name: {{ include "control-layer.fullname" . }}-email-templates
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
