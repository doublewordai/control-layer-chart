{{- /*
  Hook-phase Secret for the migration Job.

  A PreSync hook runs before ordinary Secrets are created or updated, so a Job
  that read `secrets.controlLayer` from the chart's Sync-phase Secret, or a
  rotated `extraExistingSecrets` entry, would get the PREVIOUS credentials —
  after a staging database refresh that means migrating the old database. So
  the Job gets its own copy, rendered from the same values in the hook phase:
  `secrets.controlLayer.data` (what the chart Secret carries) overlaid with
  `migrations.job.secretData` (for credentials that live outside the chart,
  such as a rotated DATABASE_URL). It is listed LAST in the Job's envFrom so
  its keys win.

  Rendered only when there is at least one non-empty value. The Job always
  loads the primary application Secret first (chart-owned or existingSecret),
  so this only overrides keys, it never removes them.
*/ -}}
{{- if and .Values.migrations.job.enabled (include "control-layer.migrations.hasSecretData" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "control-layer.migrations.secretName" . }}
  labels:
    {{- include "control-layer.migrations.labels" . | nindent 4 }}
  annotations:
    {{- include "control-layer.migrations.hookAnnotations" (dict "root" . "weight" "-5" "wave" .Values.migrations.job.prerequisiteSyncWave) | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := include "control-layer.migrations.secretData" . | fromYaml }}
  {{ $key }}: {{ $value | toString | b64enc | quote }}
  {{- end }}
{{- end }}
