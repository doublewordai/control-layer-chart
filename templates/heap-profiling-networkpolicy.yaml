{{- if and .Values.heapProfiling.enabled .Values.heapProfiling.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "control-layer.fullname" . }}-heap-profiling
  labels:
    {{- include "control-layer.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "control-layer.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: control-layer
  policyTypes:
    - Ingress
  ingress:
    # Keep normal API traffic flowing on the http port.
    - ports:
        - port: http
          protocol: TCP
    {{- /* Only the configured peers may reach pprof. With no peers there is
    no pprof rule at all, so the policy denies the port (use port-forward). A
    rule without `from` would instead allow every source. */}}
    {{- with .Values.heapProfiling.networkPolicy.from }}
    - ports:
        - port: pprof
          protocol: TCP
      from:
        {{- toYaml . | nindent 8 }}
    {{- end }}
{{- end }}
