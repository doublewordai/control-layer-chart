{{- if .Values.scouter.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "control-layer.fullname" . }}-scouter
  labels:
    {{- include "control-layer.scouter.labels" . | nindent 4 }}
spec:
  type: {{ .Values.scouter.service.type | default "LoadBalancer" }}
  ports:
    - port: {{ .Values.scouter.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "control-layer.scouter.selectorLabels" . | nindent 4 }}
{{- end }}
