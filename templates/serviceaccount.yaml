{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "control-layer.serviceAccountName" . }}
  labels:
    {{- include "control-layer.labels" . | nindent 4 }}
  {{- $commonAnnotations := include "control-layer.commonAnnotationEntries" (dict "root" . "own" .Values.serviceAccount.annotations) }}
  {{- if or .Values.serviceAccount.annotations $commonAnnotations }}
  annotations:
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with $commonAnnotations }}
    {{- . | nindent 4 }}
    {{- end }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
